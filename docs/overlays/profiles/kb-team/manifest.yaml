schema_version: 1
name: kb-team
description: Внутренняя командная KB (onboarding/runbook/role/incident)
audience: Команда разработки, DevOps, on-call
status: stable

subagents:
  pm: core
  researcher: optional
  ba: disabled
  sa: disabled
  dev: disabled
  devops: core
  qa: disabled
  tech-writer: core
  devsecops: optional
  compliance: optional

pipelines:
  project-planning: optional
  ba-acceptance: disabled
  critical-path: disabled
  scrum-agile: disabled

agent_overrides:
  tech-writer:
    source: agent-overrides/tech-writer.md

content_scaffold: content-scaffold/
doc_root: doc-root.yaml

operations:
  - op: add
    source: content-scaffold/
    target: content/
    reason: "kb-team scaffold (10-domain, 20-onboarding, 30-runbooks, 40-roles, 50-incidents)"
  - op: replace
    source: doc-root.yaml
    target: content/.doc-root.yaml
    reason: "kb-team properties (Owner, Эскалация)"

init_prompts: []

drift_pairs:
  - upstream: content/40-roles/
    downstream: content/30-runbooks/
    note: "Роли → runbook'и"
  - upstream: content/30-runbooks/
    downstream: content/20-onboarding/
    note: "Runbook'и → onboarding"
  - upstream: content/10-domain/
    downstream: content/40-roles/
    note: "Доменные знания → определения ролей"
  - upstream: content/50-incidents/
    downstream: content/30-runbooks/
    note: "Инциденты → обновление runbook'ов"

compatible_stacks: []
maintainer: project_template
