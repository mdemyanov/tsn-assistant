code: {{PROJECT_CODE}}
title: {{PROJECT_NAME}}
description: {{PROJECT_DESCRIPTION}}
style: blue-green
language: ru
supportedLanguages:
  - ru
syntax: XML

properties:
  - name: Тип контента
    type: Enum
    style: blue
    icon: file-text
    values:
      - Требование
      - Архитектура
      - ADR
      - Runbook
      - Исследование
      - Глоссарий
      - Прочее

  - name: Фаза
    type: Enum
    style: green
    icon: layers
    values:
      - PoC
      - MVP
      - Pilot
      - Production

  - name: Статус
    type: Enum
    style: orange
    icon: check-circle
    values:
      - Draft
      - Review
      - Approved
      - Superseded

filterProperties: [Тип контента, Фаза, Статус]

editors:
  - {{EDITOR_EMAIL}}
