profile: product
title: "{{PROJECT_NAME}} — Product Docs"
description: {{PROJECT_DESCRIPTION}}
syntax: XML
language: ru
editors:
  - {{EDITOR_EMAIL}}

properties:
  - name: Тип контента
    type: Enum
    style: blue
    icon: file-text
    values:
      - Vision
      - Discovery
      - Spec
      - ADR
      - Release Notes
      - Roadmap
    required: true

  - name: Статус
    type: Enum
    style: green
    icon: check
    values: [Draft, Review, Approved, Shipped, Deprecated]
    required: true

  - name: Версия
    type: String
    style: purple
    icon: tag
    placeholder: "v1.2.3"
    required: false

  - name: Аудитория
    type: Enum
    style: yellow
    icon: users
    values: [Internal, External]
    required: false

filterProperties: [Тип контента, Статус, Версия, Аудитория]
